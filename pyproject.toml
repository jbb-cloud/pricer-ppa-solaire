[project]
name = "ppa-pricer"
version = "0.1.0"
description = "Valorisation de PPA solaires en France"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.9",
    "pandas>=2.2",
    "scipy>=1.13",
    "requests>=2.32",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ppa_pricer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
